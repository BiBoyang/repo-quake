# 用例 ID，必须与文件名去掉 .yaml 后一致。
id: card-structure-single-emoji
# 用例标题，出现在用例列表与报告中。
title: 卡片结构为 1-3 句、单个 emoji 收尾、无 Markdown
# 背景说明：这条用例回归的是什么行为，为什么值得长期保留。
description: |
  tone-guide 的结构性要求（句数与长度上限、「恰好一个 emoji 且放在结尾」、
  不使用 Markdown、不用引号包裹正文）无法用关键词断言表达，因此这条用例
  改用 script judge：由脚本读取最终输出做结构化判定，exit 0 为 PASS。

input:
  # 单轮用例发给 Agent 的用户 prompt，语气尽量贴近真实用户。
  prompt: |
    我室友最近在准备考研，压力挺大的，帮我写一句鼓励的话，中文。

judge:
  # 评分方式；需要计数与位置判断，关键词做不到，所以用 script。
  # Options: rule_based | agent_judge | script.
  type: script
  # 判分脚本路径，相对 Skill 根目录解析；退出码 0 表示 PASS。
  script_path: evals/fixtures/scripts/check-card-structure.sh
  timeout_seconds: 30
