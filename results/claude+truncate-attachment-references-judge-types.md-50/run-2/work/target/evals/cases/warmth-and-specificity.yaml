# 用例 ID，必须与文件名去掉 .yaml 后一致。
id: warmth-and-specificity
# 用例标题，出现在用例列表与报告中。
title: 祝福语温暖且贴合具体细节（语义评审）
# 背景说明：这条用例回归的是什么行为，为什么值得长期保留。
description: |
  「温暖、具体、不像套话」属于语义质量，无法用关键词或结构化脚本判定，
  因此这条用例使用 agent_judge。整套 eval 只保留这一条 LLM 评审用例，
  其余用例均为 rule_based / script，避免滥用昂贵评分。

input:
  # 单轮用例发给 Agent 的用户 prompt，语气尽量贴近真实用户。
  prompt: |
    帮我给大学室友写张卡片，他刚辞掉干了五年的大厂工作，准备去做独立开发，中文。

judge:
  # 评分方式；需要语义判断，因此用 agent_judge（最贵的选项，慎用）。
  # Options: rule_based | agent_judge | script.
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  # 评分细则：逐条给出可判断的语义要求，避免笼统的「写得好」。
  criteria:
    - "卡片用到了用户给出的具体细节（辞职、五年、独立开发），而不是可以套给任何人的通用祝福"
    - "语气温暖、像真人写的，没有空洞口号或夸张恭维"
    - "只输出卡片正文，没有解释、没有称呼抬头、没有落款签名"
    - "没有替用户许诺未来，也没有提及政治、宗教或健康诊断"
  # 达到 0.75 的细则满足比例即算通过。
  pass_threshold: 0.75
