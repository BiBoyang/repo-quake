# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: warmth-and-specificity
# 用例标题，展示在用例列表与报告中。
title: 语义质量：具体、温暖、不夸张
# 用例背景：覆盖 tone-guide「Prefer concrete details over generic wishes」
# 与「warm but not exaggerated」，没有可枚举关键词，故用 LLM 评审。
description: |
  用户提供了一段共同经历（陪练三个月马拉松、下周比赛）。这条用例只看
  语义质量：是否落到具体经历、语气是否克制温暖、是否保持贺卡形态。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    我队友小杰陪我练了三个月的马拉松，下周就比赛了，想写张卡给他。

expect:
  # 门槛检查：收件人姓名必须出现。
  must_contain:
    - "小杰"

judge:
  # 判分方式：需要语义判断时才用 agent_judge，成本最高，仅此一例。
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    - "贺卡落到具体的共同经历（一起练了三个月、即将到来的比赛），而不是只有空泛祝福"
    - "语气温暖、克制，不夸张，不出现「你是最棒的」这类空口号"
    - "只输出贺卡正文：1-3 句，没有解释、抬头、落款、引号或 markdown 标记，结尾恰好一个 emoji"
    - "不替用户许下未来的承诺，例如「我会一直在你身边」"
  pass_threshold: 0.7
