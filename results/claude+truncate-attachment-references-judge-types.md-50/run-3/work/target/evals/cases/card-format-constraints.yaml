# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: card-format-constraints
# 用例标题，展示在用例列表与报告中。
title: 格式约束：长度上限、恰好一个 emoji、纯正文
# 用例背景：覆盖 tone-guide 的 Formatting 与 Style rules。
description: |
  校验「中文不超过 80 字、1-3 句、结尾恰好一个 emoji、不带抬头/落款/引号/
  markdown」。rule_based 无法表达「恰好一个」这种计数语义，因此用 script judge。

input:
  # 发送给 Agent 的用户提示。
  prompt: |
    帮我写一张感谢贺卡，谢谢老师这学期课后耐心答疑。

judge:
  # 判分方式：需要计数与结构化检查时使用 script。
  type: script
  # 判分脚本路径，相对 Skill 根目录；退出码 0 表示 PASS。
  script_path: evals/fixtures/scripts/assert-card-format.sh
  timeout_seconds: 30
