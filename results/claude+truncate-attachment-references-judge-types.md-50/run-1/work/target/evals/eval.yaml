# skill-up 评测配置的 schema 版本，请勿修改该值。
schema_version: v1alpha1

environment:
  # 每个用例使用的运行环境；纯文本输入输出不需要沙箱。
  # 可选值：none | opensandbox | docker。
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的 Skill。
  - source: local_path
    # 被测 Skill 的路径，相对本 Skill 根目录（除非写绝对路径）。
    path: .

engine:
  # 执行 prompt 并产出待评分结果的 Agent Engine。
  # 内置可选值：claude_code | codex | qodercli | qwen_code。
  name: claude_code
  # 故意不配置 model：交由引擎默认模型接管，避免与自建网关的模型别名不匹配。

cases:
  # 本评测套件包含的用例文件，路径相对 Skill 根目录。
  files:
    - evals/cases/birthday-basic.yaml
    - evals/cases/thanks-includes-recipient-name.yaml
    - evals/cases/english-input-english-card.yaml
    - evals/cases/forbidden-topics.yaml
    - evals/cases/occasion-unclear-asks-back.yaml
    - evals/cases/encouragement-avoids-empty-slogan.yaml
    - evals/cases/apology-sincere.yaml
  defaults:
    # 用例默认约束，单个用例可覆盖。
    timeout_seconds: 120
    max_turns: 4
    # 默认预检查；expect 不通过时该用例的 judge 会被跳过。
    expect:
      exit_code: 0

report:
  # 每次运行后写出的报告格式。
  # 可选值：json | junit | html。
  formats: [json, html]
