# 用例 ID，必须与文件名（去掉 .yaml）一致。
id: thanks-includes-recipient-name
# 报告中展示的用例标题。
title: 感谢场合把收件人姓名写进卡片
description: |
  验证 Skill 在“感谢”场合采用 tone-guide 中“具体说明在感谢什么”的写法，
  并遵守“用户提供了收件人姓名就必须包含”的规则。

input:
  # 单轮用例发送给 Agent 的 prompt。
  prompt: |
    帮我给同事老张写段感谢的话，上周我临时出差，他帮我把客户演示顶下来了，特别靠谱。

expect:
  # 预检查；姓名缺失说明没有遵守 SKILL.md 的规则。
  must_contain:
    - "老张"

judge:
  # 评分策略。
  # 可选值：rule_based | agent_judge | script。
  type: rule_based
  # rule_based 下必须全部满足的断言。
  success:
    - output_contains:
        all: ["老张"]
        not: ["```", "以下是", "Here is"]
    - output_matches:
        all:
          # 必须以 emoji 结尾（允许结尾 emoji 后跟变体选择符与空白）。
          - '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}][\x{FE0E}\x{FE0F}\x{200D}\x{1F3FB}-\x{1F3FF}]*\s*$'
        not:
          # 不允许叠加多个 emoji。
          - '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]\s*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]'
