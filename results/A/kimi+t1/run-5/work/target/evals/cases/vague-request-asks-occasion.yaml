# 用例 ID，与文件名（去掉 .yaml）保持一致
id: vague-request-asks-occasion
# 用例标题，展示在用例列表与报告中
title: 场合不明时应先追问而不是直接生成
description: |
  Skill 规定：场合不明确时先向用户确认。
  用户只说「帮我写张贺卡」，未说明场合与对象，
  验证 Agent 会反问场合/对象，而不是擅自生成一张贺卡。

input:
  # 单轮用例：发送给 Agent 的用户 prompt
  prompt: |
    帮我写张贺卡。

judge:
  # 判分策略: rule_based | agent_judge | script
  type: rule_based
  # 全部满足才判 PASS：输出是一个围绕场合/对象的问句
  success:
    # 输出了问句（中文或英文问号）
    - output_matches:
        any: ["[？?]"]
    - output_contains:
        any: ["生日", "感谢", "鼓励", "道歉", "场合", "对象", "occasion"]
    - exit_code: 0
