# skill-up 评测配置的 schema 版本，请勿修改
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；纯文本 Skill 无需沙箱
  # 可选：none | opensandbox | docker
  type: none

skills:
  # 评测前安装进 Agent Engine 的被测 Skill
  # source 可选：local_path
  - source: local_path
    # 被测 Skill 的路径，相对 Skill 根目录
    path: .

engine:
  # 执行 prompt 并产出待评分结果的 Agent Engine
  # 内置可选：claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 省略 model 时由引擎本地默认模型接管

cases:
  # 本评测套件包含的用例文件，相对 Skill 根目录
  files:
    - evals/cases/birthday-with-recipient-name.yaml
    - evals/cases/thanks-card-concrete.yaml
    - evals/cases/encouragement-no-empty-slogans.yaml
    - evals/cases/ambiguous-occasion-asks-clarification.yaml
    - evals/cases/apology-tone-guide-compliance.yaml
  # 所有用例继承的默认约束，用例内可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例继承的默认 expect 门槛检查
    expect:
      exit_code: 0

report:
  # 每次运行后生成的报告格式
  # 可选：json | junit | html
  formats: [json]
