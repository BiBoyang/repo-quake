# 用例 ID，与文件名（去掉 .yaml）保持一致
id: apology-tone-guide-compliance
# 用例列表与报告中展示的简短说明
title: 道歉卡应符合 tone-guide 的格式与语气规范
# 覆盖的行为：道歉语气 + 长度/emoji/排版等格式约束的综合检查
description: |
  验证道歉卡遵守 tone-guide 的综合规范：语气真诚、直接认错、不过度解释；
  正文 1-3 句、恰好一个 emoji 且位于结尾；无 markdown 格式、无称呼抬头、
  无署名。这些约束多为语义判断，故使用 agent_judge。

input:
  # 发送给 Agent 的单轮 prompt
  prompt: |
    我昨天不小心把同事小林的显示器碰坏了，帮我写张道歉卡给他。

# 低成本门槛检查；不通过时跳过 judge
expect:
  must_contain:
    - "小林"

judge:
  # 评分策略
  # 可选：rule_based | agent_judge | script
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  # 语义评分标准，尽量具体、可验证
  criteria:
    - "贺卡包含收卡人「小林」，并提到碰坏显示器这一具体事件"
    - "语气真诚，直接承认错误，没有过度解释或推卸责任"
    - "正文为 1-3 句话，恰好一个 emoji 且位于整段文字结尾"
    - "没有 markdown 格式、没有称呼抬头、没有署名，只输出贺卡正文"
  pass_threshold: 0.7
