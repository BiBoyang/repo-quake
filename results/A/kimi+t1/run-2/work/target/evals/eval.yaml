# 评测配置 schema 版本，供 skill-up 识别，请勿修改
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；纯文本 Skill 用 none 即可
  # 可选: none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的被测 Skill
  # source 可选: local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（也可用绝对路径）
    path: .

engine:
  # 执行 prompt 并产出结果的 Agent Engine
  # 内置选项: claude_code | codex | qodercli | qwen_code
  name: claude_code

cases:
  # 本评测套件包含的用例文件，相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/unclear-occasion-asks-clarification.yaml
    - evals/cases/forbidden-topics-health.yaml
    - evals/cases/encouragement-tone.yaml
    - evals/cases/format-one-emoji-short.yaml
  # 所有用例的默认约束，单个用例可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5

report:
  # 每次运行后生成的报告格式
  # 可选: json | junit | html
  formats: [json]
