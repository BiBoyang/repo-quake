# 用例 ID，需与文件名（去掉 .yaml）保持一致
id: encouragement-tone
# 用例简述
title: 鼓励贺卡的语气与分寸
description: |
  验证鼓励场景的贺卡符合 references/tone-guide.md 的语气规则：
  平稳自信、不说空洞口号（如"你是最棒的"）、不代替用户承诺未来行动。
  这类语义判断无法关键词化，使用 agent_judge。

input:
  # 单轮用户 prompt
  prompt: |
    我室友最近考研失利，情绪很低落。帮我写几句话鼓励他重新振作。

# 零成本前置检查
expect:
  exit_code: 0

judge:
  # 判定策略
  # 可选: rule_based | agent_judge | script
  type: agent_judge
  # 评审使用的模型
  model: anthropic/claude-sonnet-4-6
  # 语义评审标准，逐条打分
  criteria:
    - "输出是中文贺卡文案，语气平稳、给人信心，符合鼓励场景"
    - "没有使用空洞口号（如\"你是最棒的\"）"
    - "没有代替用户承诺未来行动（如\"我会一直陪着你\"）"
    - "正文为 1-3 句话，没有解释性文字、问候抬头或署名"
    - "全文恰好有一个 emoji，且位于文案末尾"
  # 通过阈值：达标分数比例
  pass_threshold: 0.8
