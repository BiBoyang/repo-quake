# 用例 ID，与文件名（去掉 .yaml 后缀）保持一致
id: unclear-occasion-asks
# 用例一句话说明，展示在用例列表与报告中
title: 场合不明时应先追问而不是直接生成
description: |
  SKILL.md 规定场合不清楚时要先询问，本用例验证模型不会直接编造一张卡片。

input:
  # 发送给 Agent 的单轮用户 prompt，刻意不说明场合
  prompt: |
    帮我写一张卡片。

judge:
  # 评分策略；可选：rule_based | agent_judge | script
  type: rule_based
  # rule_based 断言，全部满足才算 PASS
  success:
    - output_contains:
        any: ["？", "?"]
    - output_contains:
        any: ["场合", "生日", "感谢", "鼓励", "道歉", "祝福", "送给", "写给"]
