# 用例 ID，与文件名（去掉 .yaml 后缀）保持一致
id: encouragement-card
# 用例一句话说明，展示在用例列表与报告中
title: 鼓励卡片应语气沉稳、避免空洞口号
description: |
  语气是否沉稳可信、是否空洞口号属于语义判断，rule_based 难以精确覆盖，
  按选型决策树使用 agent_judge，并用 expect 先挡一道确定性检查。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    我朋友面试又挂了，心情很低落，写张卡片鼓励一下她。

# 低成本前置检查；不通过则跳过 judge
expect:
  must_not_contain:
    - "你是最棒的"

judge:
  # 评分策略；可选：rule_based | agent_judge | script
  type: agent_judge
  # judge 使用的模型，格式 provider/name
  model: anthropic/claude-sonnet-4-6
  # 语义评分标准，尽量具体、可验证
  criteria:
    - "输出是 1-3 句的鼓励卡片正文，没有解释性文字"
    - "语气沉稳可信，不是空洞口号（例如「你是最棒的」）"
    - "没有替用户承诺未来行动（例如「我会一直陪着你」）"
  # 通过阈值
  pass_threshold: 0.7
