# 用例 ID，与文件名（去掉 .yaml 后缀）保持一致
id: thanks-card
# 用例一句话说明，展示在用例列表与报告中
title: 感谢卡片应提及具体事件并包含收卡人姓名
description: |
  验证 Skill 写感谢卡片时能结合用户提供的具体事件（半夜帮忙排查 bug），
  并按规则包含收卡人姓名。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    上周我线上出了个 bug，多亏了同事阿杰半夜帮我一起排查，帮我写张卡片谢谢他。

# 低成本前置检查；不通过则跳过 judge
expect:
  must_contain:
    - "阿杰"

judge:
  # 评分策略；可选：rule_based | agent_judge | script
  type: rule_based
  # rule_based 断言，全部满足才算 PASS
  success:
    - output_contains:
        all: ["阿杰"]
        any: ["谢谢", "感谢", "感激", "谢你"]
