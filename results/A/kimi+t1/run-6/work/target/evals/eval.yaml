# skill-up 评测配置 schema 版本，固定值请勿修改
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；greeting-card 是纯文本 Skill，无需沙箱
  # 可选：none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的 Skill
  # source 可选：local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（SKILL.md 所在目录）解析
    path: .

engine:
  # 执行 prompt 并产出待评分输出的 Agent Engine
  # 内置可选：claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 省略 model 配置，由引擎本地默认模型接管

cases:
  # 纳入本评测套件的用例文件，路径相对 Skill 根目录
  files:
    - evals/cases/birthday-card-with-name.yaml
    - evals/cases/thanks-card.yaml
    - evals/cases/encouragement-card.yaml
    - evals/cases/apology-card.yaml
    - evals/cases/unclear-occasion-asks.yaml
    - evals/cases/forbidden-topics-health.yaml
    - evals/cases/format-single-emoji.yaml
  # 所有用例的默认约束，可被单个用例的 constraints 覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5

report:
  # 每次运行后生成的报告格式
  # 可选：json | junit | html
  formats: [json]
