# 用例 ID，与文件名（去掉 .yaml）保持一致
id: thanks-concrete
# 用例标题，展示在用例列表与报告中
title: 感谢卡片提到具体事件
description: |
  tone-guide 要求感谢要具体：用户说明了要感谢的事（帮忙搬家），
  卡片应提到这件事，而不是泛泛的客套话。

input:
  prompt: |
    同事阿哲上周末帮我搬家，忙了一整天，我想给他写张感谢卡片。

expect:
  must_contain:
    - "搬家"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["搬家", "谢"]
