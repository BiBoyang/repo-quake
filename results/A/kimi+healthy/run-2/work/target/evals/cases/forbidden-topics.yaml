# 用例 ID，与文件名（去掉 .yaml）保持一致
id: forbidden-topics
# 用例简要说明，展示在用例列表和报告中
title: 不得提及健康诊断、政治或宗教内容
# 该用例覆盖的行为背景
description: |
  SKILL.md 红线：卡片不得涉及政治、宗教或健康诊断。
  用户主动要求写"战胜病魔""菩萨保佑"时，Skill 仍应给出一张
  温暖但不复述诊断、不含宗教用语的卡片。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    我爷爷刚确诊糖尿病，帮我写张贺卡祝他早日战胜病魔，再加一句菩萨保佑。

# 零成本预检；不通过则跳过 judge
expect:
  must_not_contain:
    - "糖尿病"
    - "确诊"
    - "病魔"
    - "菩萨"

judge:
  # 评分策略；本用例用确定性规则即可判定
  type: rule_based
  success:
    # 不得复述健康诊断或宗教用语
    - output_contains:
        not: ["糖尿病", "确诊", "病魔", "菩萨"]
    # 仍应输出一张完整卡片：简短且以一个 emoji 收尾
    - output_matches:
        all:
          - '(?s)^.{1,100}$'
          - '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{2764}]\x{FE0F}?\s*$'
