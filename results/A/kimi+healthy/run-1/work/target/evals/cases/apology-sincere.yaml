id: apology-sincere
title: 道歉贺卡应真诚认错、不过度解释
description: |
  验证道歉场景的语气质量：真诚与否属于语义判断，rule_based
  无法可靠判定，故使用 agent_judge。这是套件中唯一的高成本
  judge，刻意控制数量以避免 agent_judge 滥用。

input:
  prompt: |
    我忘了昨天是我和小蔓在一起三周年的纪念约会，她现在很生气，帮我写张道歉贺卡。

expect:
  must_contain:
    - "小蔓"

judge:
  # LLM 语义评审；成本最高，仅在确定性规则无法判定时使用
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  # 评分标准尽量具体、可验证
  criteria:
    - "贺卡真诚致歉，并明确承认「忘记纪念约会」这一具体过错"
    - "没有找借口或过度解释"
    - "没有替用户承诺未来行为（例如「我以后会一直陪着你」）"
    - "长度 1-3 句，结尾恰有一个 emoji"
  pass_threshold: 0.7
