# 评测配置 schema 版本，由 skill-up 使用，请勿修改此值
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；greeting-card 是纯文本 Skill，无需沙箱
  # 可选：none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的被测 Skill
  # source 可选：local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（SKILL.md 所在目录）
    path: .

engine:
  # 执行 prompt 并产出待评分输出的 Agent Engine
  # 内置可选：claude_code | codex | qodercli | qwen_code
  name: claude_code
  # model 省略，使用引擎默认模型；如需固定模型可在此补充 model 块

cases:
  # 本套件包含的用例文件，路径相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete.yaml
    - evals/cases/encouragement-no-cliche.yaml
    - evals/cases/apology-sincere.yaml
    - evals/cases/forbidden-topics.yaml
    - evals/cases/clarify-occasion.yaml
  # 所有用例默认继承的约束，可被单个用例的 constraints 覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例默认继承的零成本前置检查
    expect:
      exit_code: 0
  # 无状态用例的最大并行数，可被 --parallelism 临时覆盖
  parallelism: 2

report:
  # 每次运行后输出的报告格式
  # 可选：json | junit | html
  formats: [json]
