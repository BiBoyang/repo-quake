# 用例 ID，与文件名（去掉 .yaml）保持一致
id: thanks-concrete
# 用例摘要，显示在用例列表和报告中
title: 感谢卡应提及收件人与具体事件
# 该用例覆盖的行为背景
description: |
  tone-guide 要求感谢卡对被感谢的事具体、不夸张，且不使用正式信函式开头。
  用户提供了同事替自己顶班的事实，卡片应围绕这件具体的事展开。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    帮我写张感谢卡给同事老王，谢谢他上周替我顶了三天班，
    让我能安心休完年假。

# 低成本前置检查；不通过则跳过 judge
expect:
  must_contain:
    - "老王"

judge:
  # 评分策略
  # 可选：rule_based | agent_judge | script
  type: rule_based
  # rule_based 下必须全部通过的断言
  success:
    - output_contains:
        all: ["老王"]
        # 除非用户要求正式风格，否则不以 "Dear" 开头
        not: ["Dear"]
