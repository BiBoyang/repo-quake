# 用例 ID，与文件名（去掉 .yaml）保持一致
id: thanks-colleague
# 用例列表与报告中展示的简要说明
title: 感谢贺卡应提及具体感谢事由
# 该用例覆盖的行为背景
description: |
  tone-guide 要求感谢场景"具体说明感谢什么"。
  验证贺卡包含收卡人和具体事由（改 bug / 项目上线），而非空泛客套。

input:
  # 发送给 Agent 的单轮用户提示词
  prompt: |
    上周项目上线，同事老张连续帮我改了三天 bug，想写张卡片谢谢他。

# 低成本前置检查；不通过时跳过 judge
expect:
  must_contain:
    - "老张"
  exit_code: 0

judge:
  # 评分策略：rule_based | agent_judge | script
  type: rule_based
  # rule_based 下必须全部通过的断言
  success:
    - output_contains:
        all: ["老张"]
        any: ["谢谢", "感谢"]
    - output_contains:
        any: ["bug", "Bug", "项目", "上线", "代码"]
    - output_matches:
        all: ['[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}]']
    - exit_code: 0
