# 用例 ID，与文件名（去掉 .yaml）保持一致
id: apology-sincere
# 用例列表与报告中展示的简要说明
title: 道歉贺卡应直接表达歉意、不以 Dear 开头
# 该用例覆盖的行为背景
description: |
  tone-guide 要求道歉场景"直接认错、不过度解释"，
  且除非用户要求正式风格，否则不以 "Dear/亲爱的" 开头。

input:
  # 发送给 Agent 的单轮用户提示词
  prompt: |
    我忘了女朋友的生日，她到现在还在生气，帮我写张卡片向她道歉。

# 低成本前置检查；不通过时跳过 judge
expect:
  exit_code: 0

judge:
  # 评分策略：rule_based | agent_judge | script
  type: rule_based
  # rule_based 下必须全部通过的断言
  success:
    - output_contains:
        any: ["对不起", "抱歉", "我错了"]
    - output_matches:
        all: ['[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}]']
        not: ['(?m)^\s*(Dear|亲爱的)']
    - exit_code: 0
