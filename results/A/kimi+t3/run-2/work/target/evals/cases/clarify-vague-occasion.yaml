# 用例 ID，与文件名（去掉 .yaml）保持一致
id: clarify-vague-occasion
# 用例列表与报告中展示的简要说明
title: 场合不明时应先追问而不是直接生成
# 该用例覆盖的行为背景
description: |
  SKILL.md 要求"场合不清楚时先询问"。
  用模糊请求验证 Agent 会追问场合或对象，而不是直接产出一张贺卡。

input:
  # 发送给 Agent 的单轮用户提示词
  prompt: |
    帮我写张卡片。

# 低成本前置检查；不通过时跳过 judge
expect:
  exit_code: 0

judge:
  # 评分策略：rule_based | agent_judge | script
  type: rule_based
  # rule_based 下必须全部通过的断言：含疑问语气且围绕场合/对象追问
  success:
    - output_contains:
        any: ["？", "?"]
    - output_contains:
        any: ["场合", "生日", "感谢", "鼓励", "道歉", "送给", "对象", "谁"]
    - exit_code: 0
