# 用例 ID，与文件名（去掉 .yaml）保持一致
id: birthday-basic
# 用例列表与报告中展示的简要说明
title: 生日贺卡应包含收卡人名字并符合基本格式
# 该用例覆盖的行为背景
description: |
  验证 Skill 能为指定对象生成生日贺卡：包含收卡人名字、
  点明生日主题、至少带一个 emoji，且不以 "Dear/亲爱的" 开头、不用 markdown。

input:
  # 发送给 Agent 的单轮用户提示词
  prompt: |
    我闺蜜小雨明天过生日，帮我写一张生日贺卡，温馨一点。

# 低成本前置检查；不通过时跳过 judge
expect:
  must_contain:
    - "小雨"
  must_not_contain:
    - "以下是"
    - "希望你喜欢"
  exit_code: 0

judge:
  # 评分策略：rule_based | agent_judge | script
  type: rule_based
  # rule_based 下必须全部通过的断言
  success:
    - output_contains:
        all: ["小雨"]
        any: ["生日", "快乐"]
    - output_matches:
        all: ['[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}]']
        not: ['(?m)^\s*(Dear|亲爱的)', '\*\*', '(?m)^#']
    - exit_code: 0
