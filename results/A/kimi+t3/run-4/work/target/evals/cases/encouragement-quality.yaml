# 稳定的用例 ID，需与文件名（去掉 .yaml）保持一致
id: encouragement-quality
# 用例的一句话说明
title: 鼓励卡的语义质量（语气、长度、emoji 规范）
# 该用例覆盖的行为背景
description: |
  验证鼓励场景下贺卡的语义质量：沉稳具体、长度合规、恰好一个结尾
  emoji、不喊空洞口号、不替用户承诺未来行动。这类断言无法用关键词
  确定性地判定，因此使用 agent_judge（成本较高，全套件仅此一条）。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    我妹妹小雅下周要参加研究生复试，特别紧张，帮我写张鼓励她的贺卡。

# 低成本预判检查；不通过则跳过 agent_judge，节省开销
expect:
  must_contain:
    - "小雅"

judge:
  # 评分策略
  # 可选: rule_based | agent_judge | script
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  # LLM 评审逐条核对的标准
  criteria:
    - "输出只有贺卡正文：没有解释、标题、署名，也没有用引号把正文包裹起来"
    - "正文为 1-3 句，总长度不超过 80 个汉字（结尾的 emoji 不计入）"
    - "全文恰好出现一个 emoji，且位于正文的最末尾"
    - "语气沉稳自信，具体呼应复试或紧张等细节，没有使用「你是最棒的」这类空洞口号"
    - "没有替用户承诺未来行动（例如「我会一直陪着你」）"
  pass_threshold: 0.7
