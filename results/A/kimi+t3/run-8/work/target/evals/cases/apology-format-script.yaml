# 用例 ID，与文件名（去掉 .yaml）保持一致
id: apology-format-script
# 用例列表和报告中展示的简短说明
title: 道歉卡片符合全部格式规则（脚本校验）
description: |
  验证 Skill 在道歉场合下的输出严格遵守 tone-guide 的格式硬规则：
  恰好一个 emoji 且位于末尾、长度 1-3 句（中文不超过 80 字）、
  无 markdown / 引号包裹 / 称呼头或落款。这些规则用确定性脚本校验，
  比关键词匹配更精确，也比 agent_judge 便宜。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    昨天我完全忘了和女朋友的恋爱纪念日，她现在还在生气，
    帮我写张道歉卡片，诚恳一点。

expect:
  exit_code: 0

judge:
  # 可选: rule_based | agent_judge | script
  type: script
  # 判分脚本路径，相对 Skill 根目录；退出码 0 为 PASS，非 0 为 FAIL
  script_path: evals/fixtures/scripts/check-card-format.sh
