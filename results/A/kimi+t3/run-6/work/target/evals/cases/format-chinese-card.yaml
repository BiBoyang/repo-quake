# 用例 ID，与文件名（去掉 .yaml）保持一致
id: format-chinese-card
# 用例一句话说明，展示在用例列表和报告中
title: 中文卡片应符合格式与长度硬规则
description: |
  用 script judge 精确校验 tone-guide 的格式规则（正则难以可靠表达）：
  恰好一个表情符号且位于最末尾、中文不超过 80 字、不超过 3 句话、
  不使用 markdown 格式。

input:
  # 发送给 Agent 的单轮用户提示词
  prompt: |
    帮我写一张感谢卡片给王老师，谢谢她这学期对我的耐心指导。

# 零成本门槛检查；不通过则跳过 judge
expect:
  must_contain:
    - "王老师"

judge:
  # 评分策略；格式规则用自定义脚本精确判定
  # 可选：rule_based | agent_judge | script
  type: script
  # 判分脚本路径，相对 Skill 根目录；exit 0 为 PASS，非 0 为 FAIL
  script_path: evals/fixtures/scripts/assert-card-format.sh
  timeout_seconds: 30
