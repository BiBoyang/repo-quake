# skill-up 评测配置的模式版本，请勿修改此值
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；纯文本 Skill 无需沙箱
  # 可选: none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的被测 Skill
  # source 可选: local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（SKILL.md 所在目录）
    path: .

engine:
  # 执行 prompt 并产出结果的 Agent Engine
  # 内置可选: claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 可选模型覆盖；省略时使用引擎默认模型
  # model:
  #   provider: anthropic
  #   name: claude-sonnet-4-6

cases:
  # 本评测套件包含的用例文件，相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete.yaml
    - evals/cases/encouragement-no-slogan.yaml
    - evals/cases/apology-sincere.yaml
    - evals/cases/no-health-diagnosis.yaml
    - evals/cases/english-birthday.yaml
    - evals/cases/clarify-occasion.yaml
  # 所有用例继承的默认约束，单个用例可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例继承的默认 expect 检查；贺卡不得出现 markdown 标记
    expect:
      exit_code: 0
      must_not_contain:
        - "**"
        - "```"
  # 无状态用例的最大并行数
  parallelism: 2

report:
  # 运行结束后生成的报告格式
  # 可选: json | junit | html
  formats: [json]
