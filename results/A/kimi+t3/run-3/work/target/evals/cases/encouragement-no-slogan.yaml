# 用例 ID，与文件名（去掉 .yaml）保持一致
id: encouragement-no-slogan
# 用例列表与报告中展示的标题
title: 鼓励卡片不使用空洞口号
# 该用例覆盖的行为说明
description: |
  验证鼓励场景：输出沉稳自信的鼓励语，
  不出现 tone-guide 明确禁止的空洞口号「你是最棒的」。

input:
  # 发送给 Agent 的单轮 prompt
  prompt: |
    我表妹下周要参加高考，她现在很紧张，帮我写一张卡片鼓励她。

# judge 之前的低成本门槛检查；不通过则跳过 judge
expect:
  must_not_contain:
    - "你是最棒的"

judge:
  # 评分策略；关键词可确定性判定，用 rule_based
  # 可选: rule_based | agent_judge | script
  type: rule_based
  # 全部满足才判定通过
  success:
    - output_contains:
        any: ["加油", "稳住", "相信", "考试", "高考"]
        not: ["你是最棒的"]
    - exit_code: 0
