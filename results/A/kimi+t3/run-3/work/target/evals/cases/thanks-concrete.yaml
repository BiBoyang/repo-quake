# 用例 ID，与文件名（去掉 .yaml）保持一致
id: thanks-concrete
# 用例列表与报告中展示的标题
title: 感谢卡片提到收件人与具体事项
# 该用例覆盖的行为说明
description: |
  验证感谢场景：输出包含收件人姓名，并体现用户给出的具体事项（顶班），
  符合 tone-guide「具体而非泛泛」的要求。

input:
  # 发送给 Agent 的单轮 prompt
  prompt: |
    同事阿杰上周帮我顶了三天班，帮我写一张感谢卡给他。

# judge 之前的低成本门槛检查；不通过则跳过 judge
expect:
  must_contain:
    - "阿杰"

judge:
  # 评分策略；关键词可确定性判定，用 rule_based
  # 可选: rule_based | agent_judge | script
  type: rule_based
  # 全部满足才判定通过
  success:
    - output_contains:
        all: ["阿杰"]
        any: ["谢谢", "感谢"]
    - output_contains:
        any: ["顶班", "替我", "帮我"]
    - exit_code: 0
