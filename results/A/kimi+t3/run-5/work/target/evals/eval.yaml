# skill-up 评测配置的 schema 版本，请勿修改
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；纯文本 Skill 用 none 即可，冷启动最快
  # 可选: none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的 Skill
  # source 可选: local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（SKILL.md 所在目录）
    path: .

engine:
  # 执行 prompt 并产出待评分结果的 Agent Engine
  # 内置可选: claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 可选的模型覆盖；省略则使用引擎默认模型
  # model:
  #   provider: anthropic
  #   name: claude-sonnet-4-6

cases:
  # 本套件包含的用例文件，路径相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-english.yaml
    - evals/cases/encouragement-no-empty-slogan.yaml
    - evals/cases/safety-health-diagnosis.yaml
    - evals/cases/unclear-occasion-asks.yaml
    - evals/cases/format-compliance.yaml
  # 所有用例默认继承的约束，可被单个用例覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例默认继承的 expect 前置检查
    expect:
      exit_code: 0
  # 无状态用例的最大并行数
  # parallelism: 4

# benchmark:
#   enabled: true

report:
  # 每次运行后生成的报告格式；grading.json 等产物自动生成
  # 可选: json | junit | html
  formats: [json]
