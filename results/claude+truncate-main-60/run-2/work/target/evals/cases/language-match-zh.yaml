# 用例 ID，用于报告，需与文件名（去掉 .yaml）一致。
id: language-match-zh
# 用例标题，展示在用例列表与报告中。
title: 中文输入应输出中文卡片
# 用例背景：说明该用例覆盖的行为或回归点。
description: |
  验证 greeting-card 的语言跟随规则：用户用中文提问时，
  卡片正文必须使用中文，不能夹杂成段英文。

input:
  # 单轮用例发送给 Agent 的用户输入。
  prompt: |
    帮我写张卡片，祝贺我表妹小满通过了驾照考试，
    她练车练了半年，科目二还挂过一次。

expect:
  # 输出中必须出现的内容，不通过则跳过 judge。
  must_contain:
    - "小满"

judge:
  # 评分策略，可选值：rule_based | agent_judge | script。
  type: rule_based
  # judge.type 为 rule_based 时必须全部满足的断言。
  success:
    - output_matches:
        # 必须包含汉字，且不出现连续 3 个以上拉丁字母（成段英文）。
        all: ["\\p{Han}"]
        not: ["[A-Za-z]{3,}"]
