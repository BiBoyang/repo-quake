# 用例 ID，用于报告，需与文件名（去掉 .yaml）一致。
id: birthday-with-name
# 用例标题，展示在用例列表与报告中。
title: 生日贺卡应包含收件人名字并只输出正文
# 用例背景：说明该用例覆盖的行为或回归点。
description: |
  验证 greeting-card 在用户给出场合（生日）与收件人名字时，
  能在 1-3 句正文里带上名字和具体细节，并且不输出 markdown。

input:
  # 单轮用例发送给 Agent 的用户输入。
  prompt: |
    帮我给小雨写一张生日贺卡。她是我大学室友，我们每年都一起爬山，
    下周就是她生日了，想写得温暖一点。

expect:
  # 输出中必须出现的内容，不通过则跳过 judge。
  must_contain:
    - "小雨"
  # 输出中不允许出现的内容。
  must_not_contain:
    - "**"
    - "```"

judge:
  # 评分策略，可选值：rule_based | agent_judge | script。
  type: rule_based
  # judge.type 为 rule_based 时必须全部满足的断言。
  success:
    - output_contains:
        all: ["小雨", "生日"]
