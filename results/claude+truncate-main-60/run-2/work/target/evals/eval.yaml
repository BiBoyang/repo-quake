# skill-up 使用的评测配置 schema 版本，固定值，请勿修改。
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；greeting-card 是纯文本 Skill，不需要沙箱。
  # 可选值：none | opensandbox | docker。
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的 Skill。
  # source 可选值：local_path。
  - source: local_path
    # 被测 Skill 的路径，相对 Skill 根目录；. 表示根目录本身。
    path: .

engine:
  # 执行用例并产出待评分输出的 Agent Engine。
  # 内置可选值：claude_code | codex | qodercli | qwen_code。
  name: claude_code

cases:
  # 本评测包含的用例文件，路径相对 Skill 根目录。
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete.yaml
    - evals/cases/encouragement-no-slogan.yaml
    - evals/cases/apology-sincere.yaml
    - evals/cases/language-match-zh.yaml
    - evals/cases/format-single-emoji.yaml
    - evals/cases/ask-when-occasion-unclear.yaml
  # 所有用例默认继承的约束，用例可在 constraints 中覆盖。
  defaults:
    timeout_seconds: 120
    max_turns: 6

report:
  # 运行结束后生成的报告格式。
  # 可选值：json | junit | html。
  formats: [json]
