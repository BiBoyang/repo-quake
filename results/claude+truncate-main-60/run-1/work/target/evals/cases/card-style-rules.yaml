# 用例 ID，必须与文件名保持一致。
id: card-style-rules
# 用例列表与报告中展示的标题。
title: 卡片正文格式：emoji 结尾、无 Markdown、长度受限
# 可选背景说明，解释该用例覆盖的行为。
description: |
  tone-guide 的格式硬约束用脚本逐项检查：恰好一个 emoji 且位于末尾、
  中文不超过 80 字、1-3 句、无 Markdown、无引号包裹、无标题与署名。

input:
  prompt: |
    帮朋友写一张感谢卡片，谢谢她在我搬家那天过来帮忙，还开车跑了两趟。

judge:
  # 多条件结构检查用自定义脚本，退出码 0 为 PASS。
  type: script
  script_path: evals/fixtures/scripts/check-card-style.py
  timeout_seconds: 30
