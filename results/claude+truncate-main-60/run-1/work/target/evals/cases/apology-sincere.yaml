# 用例 ID，必须与文件名保持一致。
id: apology-sincere
# 用例列表与报告中展示的标题。
title: 道歉卡片应坦白认错，不找借口也不替用户许诺
# 可选背景说明，解释该用例覆盖的行为。
description: |
  用户明确要求"别写太多借口"。验证卡片直接承认失约、不过度解释，
  也不替用户承诺未来的补偿行为。

input:
  prompt: |
    昨天答应陪朋友去看展，结果临时加班放了她鸽子。帮我写张道歉的卡片，
    别写太多借口，她最烦听解释了。

expect:
  must_not_contain:
    - "**"
    - "##"

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    - "卡片直接承认了自己失约，没有把责任推给加班等外部原因"
    - "没有反复解释或辩解，语气真诚而不敷衍"
    - '没有替用户承诺未来的补偿行为（例如"下次一定陪你"、"再也不会了"）'
    - "长度为 1-3 句，只输出卡片正文，结尾恰好有一个 emoji"
  pass_threshold: 0.75
