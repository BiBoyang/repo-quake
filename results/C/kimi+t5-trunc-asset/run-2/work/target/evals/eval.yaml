# skill-up 评测配置的 schema 版本，请勿修改此值
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；greeting-card 是纯文本 Skill，无需沙箱
  # 可选：none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装进 Agent Engine 的被测 Skill
  # source 可选：local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（SKILL.md 所在目录）
    path: .

engine:
  # 执行 prompt 并产出待评分输出的 Agent Engine
  # 内置可选：claude_code | codex | qodercli | qwen_code
  name: claude_code
  # model 可选；省略时使用引擎本地默认模型

cases:
  # 本套件包含的用例文件，相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete.yaml
    - evals/cases/encouragement-no-slogan.yaml
    - evals/cases/forbidden-topics.yaml
    - evals/cases/language-switch.yaml
  # 所有用例继承的默认约束，单个用例可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例继承的默认 expect 预检（切片字段与用例追加合并）
    expect:
      exit_code: 0
      # 全场景通用禁令：不用 markdown 格式；不提政治、宗教、健康诊断
      must_not_contain:
        - "```"
        - "**"
        - "政治"
        - "宗教"
        - "上帝"
        - "佛祖"
        - "耶稣"
        - "阿弥陀佛"
        - "诊断"

report:
  # 每次运行后输出的报告格式
  # 可选：json | junit | html
  formats: [json]
