# 用例 ID，与文件名（去掉 .yaml）保持一致
id: format-single-emoji
# 用例标题，展示在用例列表与报告中
title: 贺卡格式：恰好一个 emoji 且位于末尾、长度不超过 80 字
# 覆盖的规则：tone-guide 的硬性格式规则（emoji 数量与位置、长度上限）
description: |
  用 script judge 精确校验 tone-guide 的硬性格式规则：
  恰好一个 emoji、位于正文末尾、长度不超过 80 个字符。
  这些规则无法用 rule_based 的关键词匹配表达，因此使用自定义脚本。
  脚本依赖 python3（macOS 自带）。

input:
  # 发送给 Agent 的单轮用户 prompt，语气贴近真实用户
  prompt: |
    表哥上周刚搬了新家，帮我写一张乔迁贺卡，周末聚会时带给他。

# 零成本门槛检查；不通过则跳过 judge
expect:
  exit_code: 0

judge:
  # 自定义脚本校验，退出码 0 = PASS，非 0 = FAIL
  # 可选：rule_based | agent_judge | script
  type: script
  script_path: evals/fixtures/scripts/check-card-format.sh
  timeout_seconds: 30
