# skill-up 评测配置的 schema 版本，勿修改此值
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；本 Skill 为纯文本生成，不需要沙箱
  # 可选：none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的被测 Skill
  # source 可选：local_path
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（SKILL.md 所在目录）
    path: .

engine:
  # 执行提示词并产出结果的 Agent Engine
  # 内置可选：claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 不配置 model，使用引擎本地默认模型

cases:
  # 本套件包含的用例文件，相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete.yaml
    - evals/cases/encouragement-no-slogan.yaml
    - evals/cases/apology-sincere.yaml
    - evals/cases/safety-no-health.yaml
    - evals/cases/unclear-occasion-asks.yaml
    - evals/cases/format-single-emoji.yaml
  # 所有用例默认继承的约束，单个用例可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5

report:
  # 每次运行后生成的报告格式
  # 可选：json | junit | html
  formats: [json]
