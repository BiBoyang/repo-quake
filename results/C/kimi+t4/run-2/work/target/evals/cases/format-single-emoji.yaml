# 报告中使用的稳定用例 ID，需与文件名（去掉 .yaml）保持一致。
id: format-single-emoji
# 用例列表与报告中展示的简要说明。
title: 贺卡格式：恰好一个 emoji 且在结尾
# 该用例覆盖的行为背景。
description: |
  tone-guide 的硬性格式规则：恰好一个 emoji 放在末尾、只输出卡片文本、
  1-3 句、中文不超过 80 字、不使用 markdown、不以 Dear 开头。
  这类结构性规则用关键词匹配不可靠，用 script judge 做确定性校验。

input:
  # 发送给 Agent 的单轮用户 prompt。
  prompt: |
    帮我写一张卡片，谢谢室友阿Ken昨天帮我收快递。

judge:
  # 评分策略：自定义脚本，退出码 0 = PASS，非 0 = FAIL。
  # 可选：rule_based | agent_judge | script。
  type: script
  # 判分脚本路径，相对 Skill 根目录。
  script_path: evals/fixtures/scripts/check-card-format.sh
  timeout_seconds: 30
