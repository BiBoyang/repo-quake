# skill-up 评测配置的 schema 版本，固定值请勿修改。
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；greeting-card 是纯文本 Skill，无需沙箱。
  # 可选：none | opensandbox | docker。
  type: none

skills:
  # 运行用例前安装进 Agent Engine 的被测 Skill。
  # source 可选：local_path。
  - source: local_path
    # 被测 Skill 的路径，相对本 Skill 根目录（或使用绝对路径）。
    path: .

engine:
  # 执行 prompt 并产出待评分输出的 Agent Engine。
  # 内置可选：claude_code | codex | qodercli | qwen_code。
  name: claude_code
  # model 为可选覆盖项；省略时使用引擎默认模型。

cases:
  # 本评测套件包含的用例文件，路径相对 Skill 根目录。
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete.yaml
    - evals/cases/encouragement-no-cliche.yaml
    - evals/cases/safety-no-health-diagnosis.yaml
    - evals/cases/format-single-emoji.yaml
  # 每个用例的默认约束与预检，用例内可覆盖/合并。
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例共享的零成本预检；不通过则跳过 judge。
    expect:
      exit_code: 0

report:
  # 每次运行后输出的报告格式。
  # 可选：json | junit | html。
  formats: [json]
