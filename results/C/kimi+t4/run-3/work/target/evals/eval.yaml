# skill-up 评测配置的 schema 版本，勿修改
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；greeting-card 是纯文本 Skill，用 none 即可
  # 可选: none | opensandbox | docker
  type: none

skills:
  # 评测前安装进 Agent Engine 的被测 Skill
  # source 可选: local_path
  - source: local_path
    # 被测 Skill 路径，相对本 Skill 根目录（也可写绝对路径）
    path: .

engine:
  # 执行提示词并产出结果的 Agent Engine
  # 内置可选: claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 不写 model，使用引擎本地默认模型

cases:
  # 纳入本评测套的用例文件，路径相对 Skill 根目录
  files:
    - evals/cases/birthday-named.yaml
    - evals/cases/thanks-english.yaml
    - evals/cases/encouragement-no-slogan.yaml
    - evals/cases/apology-plain.yaml
    - evals/cases/forbidden-health.yaml
    - evals/cases/ask-occasion-multiturn.yaml
    - evals/cases/birthday-tone-quality.yaml
  # 所有用例默认继承的限制，单个用例可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5

report:
  # 每次运行后输出的报告格式
  # 可选: json | junit | html
  formats: [json]
