# 用例 ID，与文件名（去掉 .yaml）保持一致
id: style-format-agent-judge
# 用例标题，展示在用例列表与报告中
title: 贺卡格式与语气符合 tone-guide
# 本用例覆盖的行为背景
description: |
  全套用例中唯一一个 agent_judge 用例，覆盖 rule_based 难以断言的
  格式与语气要求：仅输出贺卡正文、恰好一个 emoji 且位于末尾、
  长度 1-3 句（中文 80 字以内）、语气温暖且具体。

input:
  # 发送给 Agent 的单轮用户提示
  prompt: |
    我表姐上周末刚搬进新家，帮我写一张贺卡祝贺她乔迁之喜。

# 零成本门槛检查，先用确定性条件挡一道再进入 LLM 评分
expect:
  must_contain:
    - "新家"
  exit_code: 0

judge:
  # 评分策略：rule_based | agent_judge | script；此处用语义评分
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  # 评分细则，须具体可验证
  criteria:
    - "输出只包含贺卡正文：没有解释、标题、署名、引号，也没有 markdown 格式"
    - "全文恰好有一个 emoji，且位于贺卡文本末尾"
    - "长度为 1-3 句话，总体不超过 80 个汉字"
    - "提到乔迁或新家这一具体事件，语气温暖，不堆砌空洞口号"
  # 通过阈值：满足比例达到该值才算 PASS
  pass_threshold: 0.7
