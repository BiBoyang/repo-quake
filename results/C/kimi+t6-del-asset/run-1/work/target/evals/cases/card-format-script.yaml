# 用例 ID，与文件名（去掉 .yaml）保持一致。
id: card-format-script
# 用例的一句话说明。
title: 贺卡格式硬约束（script 判分）
# 背景：语气指南的格式硬约束（emoji 数量与位置、句数、长度、无 markdown）适合脚本精确校验。
description: |
  用自定义脚本校验语气指南的格式硬约束：
  恰好一个 emoji 且在正文最末尾、1-3 句、
  中文不超过 80 字（或英文不超过 60 词）、
  无 markdown、无包裹引号、不以 Dear/亲爱的 开头。

input:
  # 发送给 Agent 的单轮用户 prompt。
  prompt: |
    同事小李要调去别的城市了，帮我写一张祝福他的贺卡。

# 零成本预检；不通过则跳过 judge。
expect:
  must_contain:
    - "小李"

judge:
  # 判分策略：rule_based | agent_judge | script。
  type: script
  # 判分脚本路径，相对 Skill 根目录；退出码 0 = PASS，非 0 = FAIL。
  script_path: evals/fixtures/scripts/check-card-format.sh
  # 脚本超时（秒）。
  timeout_seconds: 30
