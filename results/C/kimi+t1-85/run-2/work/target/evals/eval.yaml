# skill-up 评测配置的 schema 版本，请勿修改
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；本 Skill 为纯文本生成，用 none 即可
  # 可选：none | opensandbox | docker
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的 Skill
  # source 可选：local_path
  - source: local_path
    # 被测 Skill 的路径，相对 Skill 根目录（也可用绝对路径）
    path: .

engine:
  # 执行 prompt 并产出待评分输出的 Agent Engine
  # 内置可选：claude_code | codex | qodercli | qwen_code
  name: claude_code
  # 可选的模型覆盖；省略则使用引擎默认模型
  # model:
  #   provider: anthropic
  #   name: claude-sonnet-4-6

cases:
  # 本套件包含的用例文件，相对 Skill 根目录
  files:
    - evals/cases/birthday-with-name.yaml
    - evals/cases/thanks-concrete-detail.yaml
    - evals/cases/encouragement-no-slogan.yaml
    - evals/cases/apology-plain-format.yaml
    - evals/cases/forbidden-health-topic.yaml
  # 所有用例默认继承的约束，单个用例可覆盖
  defaults:
    timeout_seconds: 120
    max_turns: 5

report:
  # 每次运行后输出的报告格式
  # 可选：json | junit | html
  # grading.json 与 benchmark 产物会自动生成
  formats: [json]
