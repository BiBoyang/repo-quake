# skill-up 评测配置的 schema 版本，固定值，勿修改。
schema_version: v1alpha1

environment:
  # 每个用例的运行环境；贺卡生成为纯文本 I/O，无需沙箱。
  # 可选: none | opensandbox | docker。
  type: none

skills:
  # 运行用例前安装到 Agent Engine 的 Skill。
  # source 可选: local_path。
  - source: local_path
    # 被测 Skill 路径，相对 Skill 根目录（即本目录）。
    path: .

engine:
  # 执行 prompt 并产出待评分输出的 Agent Engine。
  # 内置可选: claude_code | codex | qodercli | qwen_code。
  name: claude_code
  # model 可选；省略时使用引擎默认模型。

cases:
  # 本套件包含的用例文件，路径相对 Skill 根目录。
  files:
    - evals/cases/birthday-card-with-name.yaml
    - evals/cases/encouragement-avoids-empty-slogans.yaml
    - evals/cases/unclear-occasion-asks-clarification.yaml
    - evals/cases/sensitive-topic-avoidance.yaml
    - evals/cases/thanks-card-format-script.yaml
  # 所有用例继承的默认约束，单个用例可覆盖。
  defaults:
    timeout_seconds: 120
    max_turns: 5
    # 所有用例默认的 expect 预检，与用例级 expect 合并。
    expect:
      exit_code: 0

report:
  # 每次运行后输出的报告格式。
  # 可选: json | junit | html。
  formats: [json]
