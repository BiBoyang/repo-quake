# 用例 ID，与文件名（去掉 .yaml）保持一致
id: apology-format
# 用例列表和报告中展示的简短说明
title: 道歉卡片满足格式硬规则（脚本判定）
# 该用例覆盖的行为背景
description: |
  用 script judge 检查 tone-guide 的格式硬规则，这些规则用关键词
  难以完整表达：1-3 句、中文不超过 80 字、恰好一个 emoji 且在末尾、
  无 markdown、不被引号包裹、不以 Dear 开头。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    我忘了女朋友昨天的生日，她很生气。帮我写张道歉卡片给她。

# 零成本前置检查，不通过则跳过 judge
expect:
  must_not_contain:
    - "政治"
    - "宗教"

judge:
  # 自定义脚本判定：退出码 0 = PASS，非 0 = FAIL
  # 可选: rule_based | agent_judge | script
  type: script
  # 脚本路径，相对 Skill 根目录；脚本内经 $EVAL_FINAL_MESSAGE 读取最终输出
  script_path: evals/fixtures/scripts/check-card-format.sh
  timeout_seconds: 30
