# 用例 ID，与文件名（去掉 .yaml）保持一致
id: birthday-with-name
# 用例列表和报告中展示的简短说明
title: 生日卡片包含收件人姓名并呼应具体细节
# 该用例覆盖的行为背景
description: |
  验证核心路径：生日场合、用户给出收件人姓名时，卡片必须写出名字，
  并呼应用户提供的细节；结尾恰好一个 emoji，不输出解释性文字，
  不以 Dear 开头，不代替用户承诺未来行为。

input:
  # 发送给 Agent 的单轮用户 prompt
  prompt: |
    帮我写一张生日卡片给小雨，她下周过 30 岁生日。
    我们认识十年了，她去年刚养了只猫叫“年糕”。

# 零成本前置检查，不通过则跳过 judge
expect:
  must_contain:
    - "小雨"
  must_not_contain:
    - "政治"
    - "宗教"

judge:
  # 评分策略；本用例使用确定性规则
  # 可选: rule_based | agent_judge | script
  type: rule_based
  # 全部 success 断言满足才判 PASS
  success:
    - output_contains:
        all: ["小雨"]
        any: ["生日", "三十岁", "30 岁", "30岁"]
        not: ["Dear", "我会一直", "我永远"]
    # 结尾必须是 emoji（兼容 ❤️ 这类带 VS16 的写法）
    - output_matches:
        all: ['\p{So}\x{FE0F}?\s*$']
