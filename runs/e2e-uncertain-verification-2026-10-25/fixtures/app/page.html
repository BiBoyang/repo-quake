<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Semantic Commit Audit</title></head>
<body><main>
  <h1>Asynchronous item writer</h1>
  <label for="item">Item name</label>
  <input id="item" name="item" type="text" autocomplete="off">
  <button id="save" type="button">Save Item</button>
  <div id="status" role="status">Idle</div>
  <ul id="items"></ul>
</main><script>
  const input = document.querySelector('#item');
  const status = document.querySelector('#status');
  const items = document.querySelector('#items');
  async function record(type, item) {
    await fetch('/event', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type, item }),
    });
  }
  input.addEventListener('input', () => { void record('input', input.value); });
  document.querySelector('#save').addEventListener('click', () => {
    const item = input.value;
    void (async () => {
      await record('save-request', item);
      status.textContent = `Saving ${item}`;
      await new Promise((resolve) => setTimeout(resolve, 650));
      await record('save-committed', item);
      const row = document.createElement('li');
      row.dataset.item = item;
      row.textContent = item;
      items.appendChild(row);
      status.textContent = `Saved ${item}`;
    })();
  });
</script></body></html>
